[project]
name = "scrapers"
version = "0.1.0"
requires-python = ">=3.11"
description = "MusicBrainz / Discogs / Last.fm metadata fetchers"
dependencies = [
    "musicbrainzngs>=0.7.1",
    "python3-discogs-client>=2.7",
    "pylast>=5.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
